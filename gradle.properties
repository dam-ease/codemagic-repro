org.gradle.jvmargs=-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false -XX:MaxHeapSize=8g -Xmx6g -Xms512m -XX:+UseParallelGC -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
org.gradle.configureondemand=true
org.gradle.parallel=true
kotlin.code.style=official
org.gradle.configuration-cache=true
org.gradle.caching=true
# Full mode is enabled by default now, but it is not compatible woth Retrofit and Moshi
android.enableR8.fullMode=false
android.enableJetifier=false
# AGP 9 still passes "-gpu auto-no-window" to the emulator, which is rejected by recent
# emulator builds ("Selected GPU option 'auto-no-window' is not valid"). Force a valid
# headless GPU mode for Gradle Managed Devices. swangle_indirect (ANGLE + SwiftShader)
# is the renderer recommended for headless CI on current emulator versions.
android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
# Enable verbose emulator output so silent startup failures are visible in CI logs
# (combine with `gradle --info`; AGP routes this output through logger.verbose -> INFO).
android.experimental.testOptions.managedDevices.emulator.showKernelLogging=true

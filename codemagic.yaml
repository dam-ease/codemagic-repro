definitions:
  machine_config: &machine_config
    instance_type: mac_mini_m4
    max_build_duration: 90
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/Library/Caches/Homebrew
    environment:
      java: 21
      groups:
        - Setup
        - GitHub
        - Firebase
        - Slack

  scripts:
    - &success
      name: Build finished successfully
      script: touch ~/SUCCESS
    - &unit_tests
      name: "Run unit tests"
      script: ./gradlew :app:assembleDebug
    - &detekt
      name: "Run detekt"
      script: ./gradlew detekt
    - &screenshot_tests
      name: "Run screenshot tests"
      script: ./gradlew verifyPaparazziDebug --continue
    - &update_strings
      name: "Update translations"
      script: ./gradlew updateStrings
    - &push_translations_pr
      name: "Push translations commit to GitHub and open PullRequest"
      script: ./ci/translations/open_github_review_with_translations.sh
    - &assemble_release
      name: "Assemble release"
      script: ./gradlew :app:assembleRelease
    - &bundle_release
      name: "Bundle release"
      script: ./gradlew :app:bundleRelease
    - &test_gradle_plugins
      name: "Test gradle plugins"
      script: ./gradlew :build-logic:testAllModules
    - &test_shared
      name: "Test shared modules"
      script: ./gradlew testAndroidHostTest --continue
    - &test_debug
      name: "Test debug"
      script: ./gradlew testDebug
    - &test_assemble_fake_and_android_test
      name: "Assemble fake + fake test APKs"
      script: ./gradlew assembleFake assembleFakeAndroidTest
    - &auth_to_gcloud
      name: "Authenticate to Google Cloud"
      script: ./ci/firebase/auth-to-gcloud.sh
    - &run_ui_tests
      name: "Run UI tests on FTL"
      script: ./gradlew runFlank
    - &download_huawei_api_key
      name: "Download Huawei Api key"
      script: ./ci/huawei/prepare_huawei_app_gallery_config.sh huawei_api_config.json
    - &publish_huawei_app_gallery
      name: "Publish RC to Huawei AppGallery"
      script: ./gradlew publishHuaweiAppGalleryRelease --no-configuration-cache
    - &slack_build_everything
      name: "Slack message"
      script: |
        if [  -f ~/SUCCESS ] ; then
          ci/slack/build_everything.sh -s
        else
          ci/slack/build_everything.sh -f
        fi
    - &slack_ui_tests
      name: "Slack message"
      script: |
        if [  -f ~/SUCCESS ] ; then
          ci/slack/ui_tests.sh -s
        else
          ci/slack/ui_tests.sh -f
        fi
    - &slack_ui_tests_rc
      name: "Slack message"
      script: |
        if [  -f ~/SUCCESS ] ; then
          ci/slack/ui_tests_rc.sh -s
        else
          ci/slack/ui_tests_rc.sh -f
        fi
    - &slack_screenshot_tests
      name: "Slack message"
      script: |
        if [  -f ~/SUCCESS ] ; then
          ci/slack/screenshot_tests.sh -s
        else
          ci/slack/screenshot_tests.sh -f
        fi
    - &slack_deploy_signed_apk_aab
      name: "Slack message"
      script: |
        if [  -f ~/SUCCESS ] ; then
          ci/slack/deploy_signed_apk_and_aab.sh -s
        else
          ci/slack/deploy_signed_apk_and_aab.sh -f
        fi
    - &slack_lokalise_update_strings_failed
      name: "Slack message"
      script: |
        if [ ! -f ~/SUCCESS ] ; then
          ci/slack/lokalise_update_strings_failed.sh
        fi
    - &assemble_debug
      name: "Assemble Debug"
      script: ./gradlew :app:assembleDebug
    - &replace_network_config
      name: "Replace network config"
      script: ./ci/test/replace-network-config.sh
    - &assemble_qa
      name: "Assemble QA"
      script: ./gradlew assembleQa
    - &baseline_profile_check
      name: "Run baseline profile macrobenchmarks"
      script: ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest --stacktrace --info -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
    - &baseline_profile_record
      name: "Record baseline profile"
      script: ./gradlew :app:generateReleaseBaselineProfile --stacktrace --info -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
    - &baseline_profile_open_pr
      name: "Push baseline profile commit to GitHub and open PullRequest"
      script: ./ci/baseline-profile/open_github_review_with_baseline_profile.sh
    - &slack_baseline_profile_check
      name: "Slack message"
      script: |
        if [  -f ~/SUCCESS ] ; then
          ci/slack/baseline_profile_check.sh -s
        else
          ci/slack/baseline_profile_check.sh -f
        fi
    - &slack_baseline_profile_record_failed
      name: "Slack message"
      script: |
        if [ ! -f ~/SUCCESS ] ; then
          ci/slack/baseline_profile_record_failed.sh
        fi


workflows:
  pull-request:
    name: "Pull Request"
    <<: *machine_config
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
    scripts:
      - *unit_tests
      - *detekt
  screenshot-tests:
    name: "Screenshot tests"
    <<: *machine_config
    triggering:
      cancel_previous_builds: true
    scripts:
      - *screenshot_tests
      - *success
    publishing:
      scripts:
        - *slack_screenshot_tests
  release_candidate_deploy_apk_and_aab:
    name: "Build release candidate and deploy apk and aab"
    <<: *machine_config
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v+([0-9]).+([0-9]).+([0-9])'
          include: true
    environment:
      java: 21
      groups:
        - Setup
        - Slack
        - GooglePlayStore
        - Huawei
      android_signing:
        - "CCC Android"
    scripts:
      - *update_strings
      - *assemble_release
      - *bundle_release
      - *download_huawei_api_key
      - *success
    artifacts:
      - app/build/outputs/apk/release/app-release.apk
      - app/build/outputs/bundle/release/app-release.aab
      - app/build/outputs/mapping/release/mapping.txt
      - huawei_api_config.json
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha
      scripts:
        - *publish_huawei_app_gallery
        - *slack_deploy_signed_apk_aab
  release_candidate_public_apk:
    name: "Build release candidate and publish apk"
    <<: *machine_config
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v+([0-9]).+([0-9]).+([0-9])'
          include: true
    environment:
      java: 21
      groups:
        - Setup
      android_signing:
        - "CCC Android"
    scripts:
      - *update_strings
      - *assemble_release
    artifacts:
      - app/build/outputs/apk/release/app-release.apk
  build_everything:
    name: "Builds everything"
    <<: *machine_config
    triggering:
      cancel_previous_builds: true
    scripts:
      - *test_gradle_plugins
      - *test_shared
      - *test_debug
      - *assemble_qa
      - *success
    publishing:
      scripts:
        - *slack_build_everything
  lokalise_update_strings:
    name: "Update translations"
    <<: *machine_config
    triggering:
      cancel_previous_builds: true
    scripts:
      - *update_strings
      - *push_translations_pr
      - *success
    publishing:
      scripts:
        - *slack_lokalise_update_strings_failed
  ui_tests:
    name: "UI Tests"
    <<: *machine_config
    triggering:
      cancel_previous_builds: true
    scripts:
      - *test_assemble_fake_and_android_test
      - *auth_to_gcloud
      - *run_ui_tests
      - *success
    publishing:
      scripts:
        - *slack_ui_tests
  ui_tests_rc:
    name: "UI Tests RC"
    <<: *machine_config
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v+([0-9]).+([0-9]).+([0-9])'
          include: true
      cancel_previous_builds: true
    scripts:
      - *test_assemble_fake_and_android_test
      - *auth_to_gcloud
      - *run_ui_tests
      - *success
    publishing:
      scripts:
        - *slack_ui_tests_rc
  deploy_debug_to_app_distribution:
    name: "Deploy CCCDebug to Firebase App Distribution"
    <<: *machine_config
    triggering:
      cancel_previous_builds: true
    scripts:
      - *replace_network_config
      - *assemble_debug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
    publishing:
      firebase:
        firebase_token: $FIREBASE_TOKEN_CI
        android:
          app_id: $FIREBASE_APP_ID_DEBUG
          groups:
            - ccc
            - dor
          artifact_type: 'apk'
  deploy_qa_to_app_distribution:
    name: "Deploy CCCQa to Firebase App Distribution"
    <<: *machine_config
    triggering:
      cancel_previous_builds: true
    scripts:
      - *assemble_qa
    artifacts:
      - app/build/outputs/apk/qa/app-qa.apk
    publishing:
      firebase:
        firebase_token: $FIREBASE_TOKEN_CI
        android:
          app_id: $FIREBASE_APP_ID_QA
          groups:
            - ccc
            - dor
          artifact_type: 'apk'
  prepare_qa_apk:
    name: "Build QA APK"
    <<: *machine_config
    triggering:
      cancel_previous_builds: true
    scripts:
      - *assemble_qa
    artifacts:
      - app/build/outputs/apk/qa/app-qa.apk
  prepare_release_apk:
    name: "Build Release APK"
    <<: *machine_config
    triggering:
      cancel_previous_builds: true
    environment:
      java: 21
      groups:
        - Setup
      android_signing:
        - "CCC Android"
    scripts:
      - *assemble_release
    artifacts:
      - app/build/outputs/apk/release/app-release.apk
  baseline_profile_check:
    name: "Baseline profile benchmarks"
    <<: *machine_config
    # Override: mac_mini_m4 fails to initialise HVF for the arm64 Android emulator
    # ("HVF error: HV_UNSUPPORTED"). m2 is known to expose HVF on Codemagic.
    instance_type: linux_x4
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
    scripts:
      - *baseline_profile_check
      - *success
    artifacts:
      - baselineprofile/build/outputs/connected_android_test_additional_output/**/*
      - baselineprofile/build/outputs/androidTest-results/**/*
    publishing:
      scripts:
        - *slack_baseline_profile_check
  baseline_profile_record_nightly:
    name: "Record baseline profile"
    <<: *machine_config
    # Override: mac_mini_m4 fails to initialise HVF for the arm64 Android emulator
    # ("HVF error: HV_UNSUPPORTED"). m2 is known to expose HVF on Codemagic.
    instance_type: linux_x4
    triggering:
      cancel_previous_builds: true
    scripts:
      - *baseline_profile_record
      - *baseline_profile_open_pr
      - *success
    publishing:
      scripts:
        - *slack_baseline_profile_record_failed
